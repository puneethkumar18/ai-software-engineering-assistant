services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    
    environment:
      - DATABASE_URL=postgresql+psycopg://aiassistant:aiassistant@postgres:5432/aiassistant

    volumes:
      - ./app:/app

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: aiassistant
      POSTGRES_PASSWORD: aiassistant
      POSTGRES_DB: aiassistant


    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aiassistant -d aiassistant"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: